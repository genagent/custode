# The fleet on THIS machine. Copy to `routines.toml` (gitignored) and edit.
#
#   cp routines.example.toml routines.toml
#
# With no routines.toml the node boots an empty fleet. A routine can also be
# added from the dashboard (/console, "new agent"), which writes this file.
# Set CUSTODE_CONFIG to keep it somewhere else.

# One routine is one agent: a role (profile), a repository, a checkout of it
# on this machine, and a schedule.
[[routines]]
id = "my-repo"
provider = "claude"                    # optional; claude is the default
profile = "backlog_worker"            # a role from the profiles in config/config.exs
repo = "owner/my-repo"                # the repository it works, owner/name
working_dir = "/path/to/checkout/of/my-repo"
cron = "*/30 9-18 * * *"              # in the timezone set in config (default America/Los_Angeles)
tags = ["rust"]
daily_budget_usd = 10.0               # optional: the daily spend rail

# A provider-neutral reviewer can use Codex without owning one repository.
# It sees the same Custode MCP tools and lifecycle as a Claude routine.
# [[routines]]
# id = "reviewer"
# provider = "codex"
# role = "reviewer"
# cron = "@daily"
# prompt = "Do your review sweep now."
# mcp = true
# daily_budget_tokens = 500000

# Optional overrides, each falling back to the profile: model, max_turns,
# max_budget_usd, timeout_ms, prompt, extra_allowed_tools.

# A high-capacity specialist uses a strong model for its entire sweep. The
# profile resolves Claude to Opus and Codex to the configured Sol model.
# It may be repository-backed, with a managed checkout selected in the UI,
# or a persistent non-repository subject with its standing prompt here.
# [[routines]]
# id = "hard-project"
# provider = "codex"
# profile = "specialist"
# cron = "@daily"
# prompt = "Track and resolve the difficult questions for this project."

# A sensor is a cheap cron job that polls something and wakes a routine with
# what it found. `module` is a name under Custode.Sensors.
# [[sensors]]
# id = "ci-my-repo"
# cron = "*/15 * * * *"
# module = "CiStatus"
# notify = "my-repo"
# [sensors.args]
# repo = "owner/my-repo"
