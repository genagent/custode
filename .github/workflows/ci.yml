name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      # the app path-deps on the sibling executor checkouts
      - uses: actions/checkout@v7
        with:
          repository: genagent/oban_claude
          path: .oban_claude
      - uses: actions/checkout@v7
        with:
          repository: genagent/oban_codex
          path: .oban_codex
      - uses: actions/checkout@v7
        with:
          repository: joshrotenberg/mcp_ex
          ref: 6e357655210f7f146c967f702e46be7f724866d5
          path: .mcp_ex
          ssh-key: ${{ secrets.MCP_EX_DEPLOY_KEY }}
      - name: Point the path deps at the CI checkouts
        run: |
          echo "OBAN_CLAUDE_PATH=$GITHUB_WORKSPACE/.oban_claude" >> "$GITHUB_ENV"
          echo "OBAN_CODEX_PATH=$GITHUB_WORKSPACE/.oban_codex" >> "$GITHUB_ENV"
          echo "MCP_EX_PATH=$GITHUB_WORKSPACE/.mcp_ex" >> "$GITHUB_ENV"
          echo "MCP_EX_REV=$(git -C .mcp_ex rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}-${{ env.MCP_EX_REV }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix custode.mcp.docs --check
      - run: mix test

  # Dialyzer is its own job: the PLT build is slow and its cache key differs
  # from the deps cache, so keeping it out of `test` means a red type check
  # never delays the format/credo/test signal (and vice versa).
  dialyzer:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: genagent/oban_claude
          path: .oban_claude
      - uses: actions/checkout@v7
        with:
          repository: genagent/oban_codex
          path: .oban_codex
      - uses: actions/checkout@v7
        with:
          repository: joshrotenberg/mcp_ex
          ref: 6e357655210f7f146c967f702e46be7f724866d5
          path: .mcp_ex
          ssh-key: ${{ secrets.MCP_EX_DEPLOY_KEY }}
      - name: Point the path deps at the CI checkouts
        run: |
          echo "OBAN_CLAUDE_PATH=$GITHUB_WORKSPACE/.oban_claude" >> "$GITHUB_ENV"
          echo "OBAN_CODEX_PATH=$GITHUB_WORKSPACE/.oban_codex" >> "$GITHUB_ENV"
          echo "MCP_EX_PATH=$GITHUB_WORKSPACE/.mcp_ex" >> "$GITHUB_ENV"
          # The engines are path deps, so mix.lock does not move when they do.
          # Their commits go in the cache keys, or the PLT keeps analysing an
          # engine that is no longer the one checked out (call_to_missing on a
          # function the engine had just gained).
          echo "ENGINES=$(git -C .oban_claude rev-parse --short HEAD)-$(git -C .oban_codex rev-parse --short HEAD)-$(git -C .mcp_ex rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dialyzer-${{ runner.os }}-${{ hashFiles('mix.lock') }}-${{ env.ENGINES }}
          restore-keys: mix-dialyzer-${{ runner.os }}-${{ hashFiles('mix.lock') }}-

      # The PLT is expensive to build; cache it on the toolchain and the lock
      # so it only rebuilds when one of those moves.
      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('mix.lock') }}-${{ env.ENGINES }}

      - run: mix deps.get
      - run: mix dialyzer

  # The conventional_commits policy as a CI guarantee, not just a prompt.
  # repo_open_pr already forces conventional PR TITLES; this checks every
  # BRANCH commit too, so nothing unconventional can ride a rebase merge
  # into history (squash merges hide branch commits, rebase merges keep
  # them verbatim -- both stay clean this way).
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit first line is conventional
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|build|ci|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::not conventional: $sha $subject"
              bad=1
            fi
          done < <(git log --format='%H %s' "origin/${{ github.base_ref }}..HEAD" --no-merges)
          exit $bad
